# yaml-language-server: $schema=https://blue-build.org
version: 1
name: bazzite-kineticwe
description: Versión definitiva con entorno KineticWE, Noctalia real y aprovisionamiento persistente de directorios de usuario.

base-image: ghcr.io/ublue-os/bazzite-nvidia
image-version: stable

modules:
  # 1. PURGA, REEMPLAZO DE COMPONENTES Y CONFIGURACIÓN DE REPOSITORIOS
  - type: script
    snippets:
      - |
        # 1.1 Descargar los ficheros .repo corregidos de Don para Fedora 44
        curl -Lo /etc/yum.repos.d/_copr_theblackdon-kineticwe.repo https://copr.fedorainfracloud.org/coprs/theblackdon/kineticwe/repo/fedora-44/theblackdon-kineticwe.repo
        curl -Lo /etc/yum.repos.d/_copr_lionheartp-Hyprland.repo https://copr.fedorainfracloud.org/coprs/lionheartp/Hyprland/repo/fedora-44/lionheartp-Hyprland.repo
        
        # 1.2 EL TRUCO ATÓMICO: Quitamos primero kdecoration y kglobalacceld
        rpm-ostree override remove kdecoration kglobalacceld
        
        # 1.3 EL REEMPLAZO EFECTIVO: Forzamos la sustitución completa de kwin-common usando el paquete de Copr
        rpm-ostree override replace --from repo=copr:copr.fedorainfracloud.org:theblackdon:kineticwe kwin-common
        
        # 1.4 INSTALACIÓN REAL: Añadimos los paquetes verificados de Noctalia y las aplicaciones base
        rpm-ostree install kineticwe noctalia-shell noctalia-git kitty fish dolphin mpvpaper

  # 2. PROVISIÓN ATÓMICA DE USUARIO Y CONFIGURACIÓN DE CARPETAS PERSISTENTES
  - type: script
    snippets:
      - |
        # 2.1 Configurar el esqueleto maestro global del sistema en /usr/etc/skel
        # Todo lo que pongas aquí se copiará AUTOMÁTICAMENTE a /var/home/inhumano al arrancar por primera vez
        mkdir -p /usr/etc/skel/.config/kitty
        mkdir -p /usr/etc/skel/.config/fish
        
        # Ejemplo de dotfile básico: Forzar que Fish sea la shell por defecto del esqueleto
        echo "set -g fish_greeting" > /usr/etc/skel/.config/fish/config.fish
        
        # 2.2 Registrar la cuenta del usuario de forma nativa para el primer arranque
        mkdir -p /usr/lib/sysusers.d
        echo "u inhumano - \"Usuario Inhumano\" /var/home/inhumano /usr/bin/fish" > /usr/lib/sysusers.d/inhumano.conf
        
        # 2.3 Asignar el grupo wheel (administrador) de forma automática
        echo "m inhumano wheel" >> /usr/lib/sysusers.d/inhumano.conf
        
        # 2.4 Cambiar la shell por defecto global del instalador tradicional a Fish
        sed -i 's/\/bin\/bash/\/usr\/bin\/fish/g' /etc/default/useradd
        
        # 2.5 Inyectar el hash de seguridad de la contraseña temporal '1234'
        mkdir -p /etc/shadow.d
        echo 'inhumano:$6$rounds=4096$saltstringsaltst$7MvH7WlB8Bv3Wz85H9YEx5eEclM191WpAEvA6K1oH5mYy.8u7y6IeT1oAdf3nN6HclAex8B.b06M7h/vX9Yh0.:19500:0:99999:7:::' > /etc/shadow.d/inhumano.conf
        chmod 600 /etc/shadow.d/inhumano.conf
