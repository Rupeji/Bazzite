# yaml-language-server: $schema=https://blue-build.org
version: 1
name: bazzite-kineticwe
description: Build de Auditoría. Diseñada para saltar a consola, validar credenciales y activar el entorno.

base-image: ghcr.io/ublue-os/bazzite-nvidia
image-version: stable

modules:
  # 1. TRANSMUTACIÓN ATÓMICA DE PANTALLA (TU MOTOR DE DON VERIFICADO AL 100%)
  - type: script
    snippets:
      - |
        bash -c '
        # 1.1 Enlazar los repositorios híbridos oficiales de la comunidad
        curl -Lo /etc/yum.repos.d/_copr_lionheartp-Hyprland.repo https://copr.fedorainfracloud.org/coprs/lionheartp/Hyprland/repo/fedora-44/lionheartp-Hyprland.repo
        curl -Lo /etc/yum.repos.d/_copr_theblackdon-kineticwe.repo https://copr.fedorainfracloud.org/coprs/theblackdon/kineticwe/repo/fedora-44/theblackdon-kineticwe.repo
        
        # 1.2 EL PARCHE SEGURO: Bloqueamos el noctalia duplicado de Fedora inyectando la regla en sus repos
        echo "excludepkgs=noctalia" >> /etc/yum.repos.d/fedora.repo
        echo "excludepkgs=noctalia" >> /etc/yum.repos.d/fedora-updates.repo
        
        # 1.3 Reemplazo masivo: Purgamos KDE e inyectamos el entorno real de Don de una sola vez
        rpm-ostree override remove kwin kwin-common kwin-libs kglobalacceld kdecoration --install kineticwe --install noctalia-shell-v5
        
        # 1.4 Instalamos las aplicaciones estéticas complementarias en las capas
        rpm-ostree install kitty fish dolphin mpvpaper
        '

  # 2. INYECCIÓN DE USUARIO TRADICIONAL POR BASH SEGURO (SIN HASHES ROTOS)
  - type: script
    snippets:
      - |
        bash -c '
        # 2.1 Creamos la casa física en la raíz del esqueleto
        mkdir -p /var/home/inhumano
        
        # 2.2 Registramos el usuario de forma limpia con Fish por defecto
        useradd -d /var/home/inhumano -M -G wheel -s /usr/bin/fish inhumano
        
        # 2.3 El secreto: Le inyectamos la contraseña temporal en texto plano para que el kernel la asimile
        echo "inhumano:1234" | chpasswd
        
        # 2.4 Clonamos el esqueleto y reparamos los permisos de administrador
        cp -r /etc/skel/. /var/home/inhumano/
        chown -R inhumano:inhumano /var/home/inhumano
        chmod 700 /var/home/inhumano
        
        # 2.5 Cambiar la shell global de useradd a Fish
        sed -i "s/\/bin\/bash/\/usr\/bin\/fish/g" /etc/default/useradd
        '
