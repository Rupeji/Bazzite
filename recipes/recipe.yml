# yaml-language-server: $schema=https://blue-build.org
version: 1
name: cachyos-kineticwe
description: Estructura de auditoría pura de Arch Linux optimizada con el entorno de Don.

base-image: ghcr.io/bootcrew/arch-bootc   # <--- La base atómica de Arch real e inmune (Une los espacios de abajo)
image-version: latest


modules:
  # 1. INYECCIÓN DEL ENTORNO GRAFICO SOBRE LIENZO VACÍO
  - type: script
    snippets:
      - |
        bash -c '
        # 1.1 Sincronizamos las bases de datos nativas de pacman
        pacman -Syu --noconfirm
        
        # 1.2 Inyectamos el ecosistema de Don sobre el sistema limpio (Sin KDE fantasmas)
        pacman -S --noconfirm kineticwe noctalia kitty fish dolphin mpvpaper
        '
