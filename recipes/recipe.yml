# yaml-language-server: $schema=https://blue-build.org
version: 1
name: bazzite-kineticwe
description: Versión definitiva blindada con entorno de mosaico KineticWE y Noctalia.

base-image: ghcr.io/ublue-os/bazzite-nvidia
image-version: stable

modules:
  # 1. EVITAMOS EL MODULO COPR ROTO E INYECTAMOS LOS REPOS NATIVAMENTE POR SCRIPT
  - type: script
    snippets:
      - |
        # Añadir repositorios oficiales de Don para Fedora 44 de forma directa
        curl -Lo /etc/yum.repos.d/_copr_theblackdon-kineticwe.repo https://fedorainfracloud.org
        curl -Lo /etc/yum.repos.d/_copr_theblackdon-noctalia.repo https://fedorainfracloud.org

  # 2. SELECCIONAMOS LOS PAQUETES QUE EL MOTOR COPIARÁ EN LAS CAPAS DE LA ISO
  - type: rpm-ostree
    install:
      - noctalia
      - kineticwe
      - kitty
      - fish
      - dolphin
      - mpvpaper

  # 3. BLOQUE SEGURO DE CREACIÓN DE TU CASA /VAR/HOME/INHUMANO
  - type: script
    snippets:
      - |
        # Configurar la carpeta personal física para que no dé fallos de Login Loop
        mkdir -p /var/home/inhumano
        
        # Registrar tu cuenta con Fish por defecto
        useradd -d /var/home/inhumano -M -G wheel -s /usr/bin/fish inhumano
        
        # Inyectar tu contraseña temporal '1234'
        echo "inhumano:1234" | chpasswd
        
        # Clonar las configuraciones básicas a tu casa y reparar permisos de administrador
        cp -r /etc/skel/. /var/home/inhumano/
        chown -R inhumano:inhumano /var/home/inhumano
        chmod 700 /var/home/inhumano
        
        # Cambiar el esqueleto global de la terminal a Fish
        sed -i 's/\/bin\/bash/\/usr\/bin\/fish/g' /etc/default/useradd
