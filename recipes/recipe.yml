# yaml-language-server: $schema=https://blue-build.org
version: 1
name: bazzite-kineticwe
description: Imagen estilo 'Donzzite' de Bazzite con el entorno KineticWE, Kitty y Fish.

base-image: ghcr.io/ublue-os/bazzite-nvidia
image-version: stable

modules:
  # 1. REPOSITORIOS: Habilitamos las fuentes Copr oficiales
  - type: copr
    repos:
      - theblackdon/kineticwe
      - lionheartp/Hyprland

  # 2. EL REEMPLAZO VIA SCRIPT: Sustitución de KWin por KineticWE sin romper dependencias
  - type: script
    scripts:
      - |
        #!/usr/bin/env bash
        set -ox pipefail
        rpm-ostree override replace --experimental --from repo=copr:copr.fedorainfracloud.org:theblackdon:kineticwe kwin kwin-common kwin-libs kglobalacceld kdecoration

  # 3. INSTALACIÓN NATIVA: Solo las herramientas de interfaz y terminal esenciales
  - type: rpm-ostree
    install:
      - noctalia   # La shell oficial de mosaico (tiling)
      - kitty      # Terminal por GPU
      - fish       # Shell interactiva
      - dolphin    # Administrador de archivos

  # 4. CONFIGURACIÓN: Forzar a Fish como shell predeterminada
  - type: script
    scripts:
      - |
        #!/usr/bin/env bash
        set -ox pipefail
        sed -i 's/\/bin\/bash/\/usr\/bin\/fish/g' /etc/default/useradd
