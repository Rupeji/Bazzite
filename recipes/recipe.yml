# yaml-language-server: $schema=https://blue-build.org
version: 1
name: bazzite-kineticwe
description: Imagen estilo 'Donzzite' de Bazzite con el entorno KineticWE, Kitty y Fish.

base-image: ghcr.io/ublue-os/bazzite-nvidia
image-version: stable

modules:
  # 1. ENLACE SEGURO DE REPOSITORIOS Y REEMPLAZO VIA SCRIPT
  # Forzamos la descarga de los repos .repo de Copr de forma directa esquivando fallas del validador
  - type: script
    scripts:
      - |
        #!/usr/bin/env bash
        set -ox pipefail
        
        # Inyectamos los repositorios Copr nativos en los directorios del sistema
        curl -Lo /etc/yum.repos.d/_copr_theblackdon-kineticwe.repo https://fedorainfracloud.org(rpm -E %fedora)/theblackdon-kineticwe.repo
        curl -Lo /etc/yum.repos.d/_copr_lionheartp-Hyprland.repo https://fedorainfracloud.org(rpm -E %fedora)/lionheartp-Hyprland.repo
        
        # Ejecutamos la sustitución oficial estilo Don
        rpm-ostree override replace --experimental --from repo=copr:copr.fedorainfracloud.org:theblackdon:kineticwe kwin kwin-common kwin-libs kglobalacceld kdecoration

  # 2. INSTALACIÓN NATIVA
  - type: rpm-ostree
    install:
      - noctalia
      - kitty
      - fish
      - dolphin

  # 3. CONFIGURACIÓN: Forzar a Fish como shell predeterminada
  - type: script
    scripts:
      - |
        #!/usr/bin/env bash
        set -ox pipefail
        sed -i 's/\/bin\/bash/\/usr\/bin\/fish/g' /etc/default/useradd
