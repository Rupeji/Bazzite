---
# yaml-language-server: $schema=https://blue-build.org
version: 1
name: bazzite-kineticwe
description: Imagen estilo 'Donzzite' de Bazzite con el entorno KineticWE, Kitty y Fish.

base-image: ghcr.io/ublue-os/bazzite-nvidia
image-version: stable

modules:
  # 1. REPOSITORIOS: Fuentes Copr oficiales para KineticWE y Noctalia
  - type: copr
    repos:
      - theblackdon/kineticwe
      - lionheartp/Hyprland

  # 2. EL REEMPLAZO: Sustitución de KWin nativo para evitar bloqueos
  - type: rpm-ostree
    replace:
      - package: kwin
        with: kineticwe
      - package: kwin-common
        with: kineticwe
      - package: kwin-libs
        with: kineticwe
      - package: kglobalacceld
        with: kineticwe
      - package: kdecoration
        with: kineticwe

  # 3. PURGA DE BAZZITE: Limpieza de herramientas de fábrica como hace Don
  - type: rpm-ostree
    remove:
      - bazzite-portal
      - bazzite-updater

  # 4. INSTALACIÓN NATIVA: Tus herramientas diarias vía RPM
  - type: rpm-ostree
    install:
      - noctalia
      - kitty
      - fish
      - dolphin
      - obs-studio
      - discord

  # 5. CONFIGURACIÓN: Forzar a Fish como shell predeterminada en el sistema
  - type: script
    scripts:
      - |
        #!/usr/bin/env bash
        set -ox pipefail
        sed -i 's/\/bin\/bash/\/usr\/bin\/fish/g' /etc/default/useradd
