# yaml-language-server: $schema=https://blue-build.org
version: 1
name: bazzite-kineticwe
description: Versión definitiva con entorno KineticWE forzado anulando conflictos de KDE de forma nativa.

base-image: ghcr.io/ublue-os/bazzite-nvidia
image-version: stable

modules:
  # 1. TRANSMUTACIÓN ATÓMICA DE PANTALLA (EL MÉTODO OFICIAL DE DON)
  - type: script
    snippets:
      - |
        bash -c '
        # 1. Enlazar los repositorios híbridos oficiales de la comunidad
        curl -Lo /etc/yum.repos.d/_copr_lionheartp-Hyprland.repo https://copr.fedorainfracloud.org/coprs/lionheartp/Hyprland/repo/fedora-44/lionheartp-Hyprland.repo
        curl -Lo /etc/yum.repos.d/_copr_theblackdon-kineticwe.repo https://copr.fedorainfracloud.org/coprs/theblackdon/kineticwe/repo/fedora-44/theblackdon-kineticwe.repo
        
        # 2. Reemplazo masivo: Purgamos los motores de KDE e inyectamos el entorno de mosaico de una sola vez
        rpm-ostree override remove kwin kwin-common kwin-libs kglobalacceld kdecoration --install kineticwe --install noctalia
        
        # 3. Instalamos las aplicaciones estéticas complementarias en las capas
        rpm-ostree install kitty fish dolphin mpvpaper
        '
  # 2. BLOQUE SEGURO DE CREACIÓN DE TU CASA /VAR/HOME/INHUMANO
  - type: script
    snippets:
      - |
        bash -c '
        # Configurar la carpeta personal física
        mkdir -p /var/home/inhumano
        
        # Registrar tu cuenta con Fish por defecto
        useradd -d /var/home/inhumano -M -G wheel -s /usr/bin/fish inhumano
        
        # Inyectar tu contraseña temporal "1234"
        echo "inhumano:1234" | chpasswd
        
        # Copiar el esqueleto y reparar permisos de administrador
        cp -r /etc/skel/. /var/home/inhumano/
        chown -R inhumano:inhumano /var/home/inhumano
        chmod 700 /var/home/inhumano
        
        # Cambiar el esqueleto global de la terminal a Fish
        sed -i "s/\/bin\/bash/\/usr\/bin\/fish/g" /etc/default/useradd
        '
