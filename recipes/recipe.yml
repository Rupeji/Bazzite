# yaml-language-server: $schema=https://blue-build.org
version: 1
name: bazzite-kineticwe
description: Versión Frankenstein definitiva. Tu base de recámara con Auto-Login nativo por directorios.

base-image: ghcr.io/ublue-os/bazzite-nvidia
image-version: stable

modules:
  # 1. TRANSMUTACIÓN ATÓMICA DE PANTALLA (TU CÓDIGO DE LA RECÁMARA IMPECABLE)
  - type: script
    snippets:
      - |
        bash -c '
        # 1.1 Enlazar los repositorios híbridos oficiales de la comunidad
        curl -Lo /etc/yum.repos.d/_copr_lionheartp-Hyprland.repo https://copr.fedorainfracloud.org/coprs/lionheartp/Hyprland/repo/fedora-44/lionheartp-Hyprland.repo
        curl -Lo /etc/yum.repos.d/_copr_theblackdon-kineticwe.repo https://copr.fedorainfracloud.org/coprs/theblackdon/kineticwe/repo/fedora-44/theblackdon-kineticwe.repo
        
        # 1.2 EL TRUCO: Le inyectamos una regla al repositorio oficial de Fedora para que ignore su propio noctalia duplicado
        echo "excludepkgs=noctalia" >> /etc/yum.repos.d/fedora.repo
        echo "excludepkgs=noctalia" >> /etc/yum.repos.d/fedora-updates.repo
        
        # 1.3 Reemplazo masivo limpio: Purgamos KDE e inyectamos el entorno real de Don sin conflictos
        rpm-ostree override remove kwin kwin-common kwin-libs kglobalacceld kdecoration --install kineticwe --install noctalia-shell-v5
        
        # 1.4 Instalamos las aplicaciones estéticas complementarias en las capas
        rpm-ostree install kitty fish dolphin mpvpaper
        '

  # 2. CONFIGURACIÓN DEL ESQUELETO PRE-INICIO PERSISTENTE
  - type: script
    snippets:
      - |
        bash -c '
        # 2.1 Usamos el /etc/skel REAL (El que Fedora clona al crear usuarios físicamente)
        mkdir -p /etc/skel/.config/kitty
        mkdir -p /etc/skel/.config/fish
        echo "set -g fish_greeting" > /etc/skel/.config/fish/config.fish
        
        # 2.2 Forzar a Fish como la shell predeterminada para cualquier usuario nuevo
        sed -i "s/\/bin\/bash/\/usr\/bin\/fish/g" /etc/default/useradd
        '
