# yaml-language-server: $schema=https://blue-build.org
version: 1
name: bazzite-kineticwe
description: Versión definitiva con entorno de mosaico KineticWE y Noctalia nativos.

base-image: ghcr.io/ublue-os/bazzite
image-version: stable

modules:
  # 1. INYECTAMOS EL REPOSITORIO COPR DE FORMA NATIVA (Obligatorio para Fedora 44)
  - type: copr
    enable:
      - theblackdon/kineticwe
      - theblackdon/noctalia

  # 2. INSTALAMOS LOS PAQUETES DIRECTAMENTE DESDE EL MOTOR DEL SISTEMA
  - type: rpm-ostree
    install:
      - noctalia
      - kineticwe
      - kitty
      - fish
      - dolphin
      - mpvpaper    # ¡Ya lo dejamos metido para tu futuro fondo animado!

  # 3. FORZAMOS LAS CONFIGURACIONES DE INICIO USANDO EL MÓDULO DE COMANDOS SEGURO
  - type: signing
